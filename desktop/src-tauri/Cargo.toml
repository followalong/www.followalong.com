[package]
name = "follow-along"
version = "0.0.0" # unused: tauri.conf.json takes the version from ../../package.json
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "follow_along_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# open_url reaches UIApplication by hand: the opener plugin's Swift package does not link on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
