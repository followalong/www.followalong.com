name: Release iOS

# Builds the pushed version tag, or main when run by hand, and sends it to TestFlight.
# The steps live in testflight.yml, which 66 Scripts runs too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-ios

jobs:
  testflight:
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
